<body>
    <!-- Placeholder for global header -->
    <header class="site-header"></header>

    <!-- Album Photos Section -->
    <section class="albums-section">
        <div class="container">

            <a href="../events.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Events

            <div class="page-header">
                <h2 class="page-title">2026-07-15 World Cup England vs Argentina | Atlanta, GA</h2>

            <div id="photo-grid" class="photos-grid">

            </div>
        </div>
    </section>

    <!-- Official Site Section -->
    <div class="container artist-official-section">
        <p class="section-label">Official Site</p>
        <a href="https://www.englandfootball.com/england" target="_blank" rel="noopener" class="artist-official-link">
            <i class="fas fa-external-link-alt"></i>

    </div>

    <!-- Photo Tags -->
    <div class="container" style="text-align: center; padding: 0 0 1.5rem 0;">
        <div id="photo-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px;"></div>
    </div>

    <!-- Album Navigation at Bottom -->
    <div class="album-bottom-navigation">
        <div class="container">
            <button id="prev-album" class="album-nav-btn album-nav-left" title="Previous Album">
                <i class="fas fa-chevron-left"></i>
                <span class="nav-label">Previous</span>
            </button>
            <a href="../events.html" class="back-button back-button-center">
                <i class="fas fa-arrow-left"></i> Back to Events

    <footer class="site-footer" id="global-footer"></footer>

        <div class="lightbox-content">
            <button class="lightbox-share" onclick="toggleLightboxShare()">

            </button>
            <div class="lightbox-share-menu" id="lightbox-share-menu">
                <a href="#" onclick="shareLightboxPhoto('instagram'); return false;"><i class="fab fa-instagram"></i></a>

                <a href="#" onclick="shareLightboxPhoto('facebook'); return false;"><i class="fab fa-facebook"></i></a>
                <a href="#" onclick="shareLightboxPhoto('copy'); return false;"><i class="fas fa-link"></i></a>

            <button class="lightbox-nav lightbox-prev" onclick="prevLightboxImage()">
                <i class="fas fa-chevron-left"></i>
            </button>

            <button class="lightbox-nav lightbox-next" onclick="nextLightboxImage()">
                <i class="fas fa-chevron-right"></i>
            </button>
            <div class="lightbox-caption" id="lightbox-caption"></div>
            <div class="lightbox-counter" id="lightbox-counter"></div>
        </div>
    </div>

    <script src="../js/main.js?v=20260804-0500"></script>
    <script>
        // Load photos from this specific Flickr album
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize album navigation arrows
            initializeAlbumNavigation();
            const albumUrl = 'https://www.flickr.com/photos/jayneclamp/albums/72177720334823270/';
            displayAlbumPhotos(albumUrl);

            // Update social media meta tags dynamically
            setAlbumSocialMeta(albumUrl);
        });
    </script>
