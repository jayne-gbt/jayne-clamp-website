    <script>
        const youtubeVideos = [
            { url: 'https://youtu.be/rtLa40tRXWk', title: 'Kevn Kinney, Peter Buck & Mike Mills "Honeysuckle Blue" 2025-04-20 @ Rialto Room | Athens, GA' },
            { url: 'https://youtu.be/ySAl7iV-HaI', title: 'Mike Mills, Kevn Kinney & Peter Buck "Apartment #9" 2025-04-20 @ Rialto Room | Athens, GA' },
            { url: 'https://youtu.be/ooXYAl6K_TY', title: 'Mike Mills, Peter Buck & Kevn Kinney "Don\'t Go Back to Rockville" 2025-04-20 Rialto Room | Athens, GA' }
        ];

        function getYouTubeVideoId(url) {
            const shortMatch = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
            if (shortMatch) return shortMatch[1];
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideos() {
            const videoGrid = document.getElementById('video-grid');
            const loading = document.getElementById('loading');
            const videoCount = document.getElementById('video-count');
            videoCount.textContent = youtubeVideos.length;
            let videoHTML = '';
            youtubeVideos.forEach((video) => {
                const videoId = getYouTubeVideoId(video.url);
                if (videoId) {
                    videoHTML += `
                        <div class="video-card video-item" data-tags="kevnkinney,peterbuck,mikemills,rialtoroom,athensga,athensgamusic,livemusic">
                            <div class="video-embed">
                                <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                            </div>
                            <div class="video-info">
                                <div class="video-title">${video.title}</div>
                            </div>
                        </div>
                    `;
                }
            });
            videoGrid.innerHTML = videoHTML;
            loading.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeAlbumNavigation();
            loadVideos();
        });
    </script>
